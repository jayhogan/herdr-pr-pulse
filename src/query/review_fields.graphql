# Appended to every review detail query; each alias adds statusCheckRollup (it needs the
# PR's own id). Only what the Review view shows or filters on: no stacks, threads, behind-by
# or merge state.
fragment reviewFields on PullRequest {
  id
  number
  title
  url
  state
  isDraft
  closedAt
  updatedAt
  createdAt
  body
  author { login __typename }
  repository { nameWithOwner }
  headRefName
  headRefOid
  baseRefName
  reviewDecision
  latestReviews(first: 20) { nodes { state submittedAt author { login __typename } } }
  reviewRequests(first: 20) {
    nodes {
      asCodeOwner
      requestedReviewer { __typename ... on User { login } ... on Bot { login } ... on Team { slug } }
    }
  }
  timelineItems(itemTypes: [READY_FOR_REVIEW_EVENT], last: 1) {
    nodes { ... on ReadyForReviewEvent { createdAt } }
  }
  commits(last: 1) { nodes { commit { committedDate } } }
}
